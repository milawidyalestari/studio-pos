<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio POS - Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Minimal background pattern */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            opacity: 0.1;
        }

        .splash-container {
            text-align: center;
            z-index: 10;
            position: relative;
            max-width: 400px;
            padding: 40px 30px;
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        /* Logo */
        .logo-container {
            margin-bottom: 25px;
            position: relative;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
            animation: logoGlow 3s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .logo-icon {
            font-size: 32px;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* App Title */
        .app-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            animation: titleFadeIn 1s ease-out;
        }

        .app-subtitle {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
            font-weight: 300;
            animation: titleFadeIn 1s ease-out 0.2s both;
        }

        @keyframes titleFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loading Section */
        .loading-section {
            animation: loadingFadeIn 1s ease-out 0.5s both;
        }

        .loading-text {
            color: white;
            font-size: 0.9rem;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 3px;
            width: 0%;
            animation: progressAnimation 3s ease-out forwards;
        }

        @keyframes progressAnimation {
            0% { width: 0%; }
            20% { width: 30%; }
            40% { width: 60%; }
            60% { width: 80%; }
            80% { width: 95%; }
            100% { width: 100%; }
        }

        /* Loading Dots */
        .loading-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: dotBounce 1.5s ease-in-out infinite;
        }

        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotBounce {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.6;
            }
            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        /* Status Message */
        .status-message {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.85rem;
            margin-top: 15px;
            min-height: 20px;
            transition: all 0.3s ease;
        }

        /* Version Info */
        .version-info {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.7rem;
            font-weight: 300;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .splash-container {
                padding: 30px 20px;
                margin: 20px;
            }
            
            .app-title {
                font-size: 1.8rem;
            }
            
            .logo {
                width: 60px;
                height: 60px;
            }
            
            .logo-icon {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    
    <div class="splash-container">
        <!-- Logo -->
        <div class="logo-container">
            <div class="logo">
                <div class="logo-icon">📊</div>
            </div>
        </div>

        <!-- App Title -->
        <h1 class="app-title">Studio POS</h1>
        <p class="app-subtitle">Point of Sale System</p>

        <!-- Loading Section -->
        <div class="loading-section">
            <div class="loading-text">Initializing Application...</div>
            
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
            
            <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            
            <div class="status-message" id="statusMessage">Loading modules...</div>
        </div>
    </div>

    <div class="version-info">v1.0.0</div>

    <script>
        // Loading simulation
        const statusMessages = [
            "Loading modules...",
            "Initializing database...",
            "Loading user interface...",
            "Preparing workspace...",
            "Almost ready..."
        ];

        let currentStep = 0;
        const statusElement = document.getElementById('statusMessage');

        function updateStatus() {
            if (currentStep < statusMessages.length) {
                statusElement.textContent = statusMessages[currentStep];
                currentStep++;
                setTimeout(updateStatus, 800);
            } else {
                statusElement.textContent = "Ready!";
                statusElement.style.color = "#4ade80";
            }
        }

        // Start the loading animation
        setTimeout(updateStatus, 500);
    </script>
</body>
</html>
