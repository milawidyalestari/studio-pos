<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio POS - Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.1) 0%, transparent 50%);
            animation: patternMove 20s ease-in-out infinite;
        }

        @keyframes patternMove {
            0%, 100% { transform: translateX(0) translateY(0); }
            25% { transform: translateX(-20px) translateY(-10px); }
            50% { transform: translateX(20px) translateY(10px); }
            75% { transform: translateX(-10px) translateY(20px); }
        }

        .splash-container {
            text-align: center;
            z-index: 10;
            position: relative;
            max-width: 450px;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
        }

        /* Logo */
        .logo-container {
            margin-bottom: 30px;
            position: relative;
        }

        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
            animation: logoGlow 3s ease-in-out infinite;
            position: relative;
        }

        .logo::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #f5576c);
            border-radius: 27px;
            z-index: -1;
            animation: logoBorder 3s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(2deg); }
        }

        @keyframes logoBorder {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .logo-icon {
            font-size: 40px;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* App Title */
        .app-title {
            font-size: 2.8rem;
            font-weight: 800;
            color: white;
            margin-bottom: 8px;
            text-shadow: 0 3px 15px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleSlideIn 1s ease-out;
        }

        .app-subtitle {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 0.5px;
            animation: titleSlideIn 1s ease-out 0.2s both;
        }

        @keyframes titleSlideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loading Section */
        .loading-section {
            animation: loadingFadeIn 1s ease-out 0.5s both;
        }

        .loading-text {
            color: white;
            font-size: 1rem;
            margin-bottom: 25px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 25px;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 50%, #4ade80 100%);
            border-radius: 4px;
            width: 0%;
            position: relative;
            animation: progressAnimation 4s ease-out forwards;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.5);
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: progressShine 2s ease-in-out infinite;
        }

        @keyframes progressAnimation {
            0% { width: 0%; }
            15% { width: 20%; }
            30% { width: 45%; }
            45% { width: 70%; }
            60% { width: 85%; }
            75% { width: 95%; }
            100% { width: 100%; }
        }

        @keyframes progressShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Loading Dots */
        .loading-dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation: dotBounce 1.8s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.6s; }

        @keyframes dotBounce {
            0%, 80%, 100% {
                transform: scale(0.8) translateY(0);
                opacity: 0.6;
            }
            40% {
                transform: scale(1.2) translateY(-10px);
                opacity: 1;
            }
        }

        /* Status Message */
        .status-message {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            margin-top: 20px;
            min-height: 25px;
            transition: all 0.3s ease;
            font-weight: 400;
        }

        /* Version Info */
        .version-info {
            position: absolute;
            bottom: 15px;
            right: 15px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.75rem;
            font-weight: 300;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .splash-container {
                padding: 30px 25px;
                margin: 20px;
            }
            
            .app-title {
                font-size: 2.2rem;
            }
            
            .logo {
                width: 80px;
                height: 80px;
            }
            
            .logo-icon {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    
    <div class="splash-container">
        <!-- Logo -->
        <div class="logo-container">
            <div class="logo">
                <div class="logo-icon">📊</div>
            </div>
        </div>

        <!-- App Title -->
        <h1 class="app-title">Studio POS</h1>
        <p class="app-subtitle">Professional Point of Sale System</p>

        <!-- Loading Section -->
        <div class="loading-section">
            <div class="loading-text">Initializing Application...</div>
            
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
            
            <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            
            <div class="status-message" id="statusMessage">Loading modules...</div>
        </div>
    </div>

    <div class="version-info">v1.0.0</div>

    <script>
        // Loading simulation with realistic steps
        const statusMessages = [
            "Loading modules...",
            "Initializing database...",
            "Loading user interface...",
            "Preparing workspace...",
            "Almost ready..."
        ];

        let currentStep = 0;
        const statusElement = document.getElementById('statusMessage');

        function updateStatus() {
            if (currentStep < statusMessages.length) {
                statusElement.textContent = statusMessages[currentStep];
                currentStep++;
                
                setTimeout(updateStatus, 1000);
            } else {
                statusElement.textContent = "Ready!";
                statusElement.style.color = "#4ade80";
                statusElement.style.fontWeight = "600";
            }
        }

        // Start the loading animation
        setTimeout(updateStatus, 500);

        // Add some random delay to make it feel more realistic
        setTimeout(() => {
            if (currentStep === 0) {
                updateStatus();
            }
        }, 2000);
    </script>
</body>
</html>
