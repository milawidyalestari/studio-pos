<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .background {
        fill: #2962FF;
      }
      .letter {
        fill: #FFFFFF;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 320px;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>
  
  <!-- Background dengan sudut membulat (squircle) -->
  <rect x="0" y="0" width="512" height="512" rx="120" ry="120" class="background"/>
  
  <!-- Huruf S di tengah -->
  <text x="256" y="256" class="letter">S</text>
</svg>