<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio POS - Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background Animation */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #667eea, #764ba2, #f093fb, #f5576c);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            opacity: 0.1;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Main Container */
        .splash-container {
            text-align: center;
            z-index: 10;
            position: relative;
            max-width: 500px;
            padding: 40px;
        }

        /* Logo Area */
        .logo-container {
            margin-bottom: 40px;
            position: relative;
        }

        .logo {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .logo-icon {
            font-size: 48px;
            color: #667eea;
        }

        /* App Title */
        .app-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            animation: titleFadeIn 1s ease-out;
        }

        .app-subtitle {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.9);
            margin-bottom: 40px;
            font-weight: 300;
            animation: titleFadeIn 1s ease-out 0.3s both;
        }

        @keyframes titleFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loading Section */
        .loading-section {
            animation: loadingFadeIn 1s ease-out 0.6s both;
        }

        .loading-text {
            color: white;
            font-size: 1rem;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 3px;
            width: 0%;
            animation: progressAnimation 3s ease-in-out;
        }

        @keyframes progressAnimation {
            0% { width: 0%; }
            20% { width: 25%; }
            40% { width: 50%; }
            60% { width: 75%; }
            80% { width: 90%; }
            100% { width: 100%; }
        }

        /* Loading Dots */
        .loading-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: dotPulse 1.5s ease-in-out infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        /* Status Messages */
        .status-message {
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
            margin-top: 15px;
            min-height: 20px;
            transition: opacity 0.3s ease;
        }

        /* Version Info */
        .version-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255,255,255,0.6);
            font-size: 0.8rem;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .splash-container {
                padding: 20px;
            }
            
            .app-title {
                font-size: 2rem;
            }
            
            .logo {
                width: 100px;
                height: 100px;
            }
            
            .logo-icon {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    
    <div class="splash-container">
        <!-- Logo -->
        <div class="logo-container">
            <div class="logo">
                <div class="logo-icon">📊</div>
            </div>
        </div>

        <!-- App Title -->
        <h1 class="app-title">Studio POS</h1>
        <p class="app-subtitle">Point of Sale System</p>

        <!-- Loading Section -->
        <div class="loading-section">
            <div class="loading-text">Initializing Application...</div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            
            <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            
            <div class="status-message" id="statusMessage">Loading modules...</div>
        </div>
    </div>

    <div class="version-info">v1.0.0</div>

    <script>
        // Loading simulation with realistic steps
        const statusMessages = [
            "Loading modules...",
            "Initializing database...",
            "Loading user interface...",
            "Preparing workspace...",
            "Almost ready..."
        ];

        let currentStep = 0;
        const statusElement = document.getElementById('statusMessage');
        const progressBar = document.getElementById('progressBar');

        function updateStatus() {
            if (currentStep < statusMessages.length) {
                statusElement.textContent = statusMessages[currentStep];
                currentStep++;
                
                // Update progress bar
                const progress = (currentStep / statusMessages.length) * 100;
                progressBar.style.width = progress + '%';
                
                setTimeout(updateStatus, 800);
            }
        }

        // Start the loading animation
        setTimeout(updateStatus, 1000);

        // Simulate loading completion
        setTimeout(() => {
            statusElement.textContent = "Ready!";
            statusElement.style.color = "#4ade80";
        }, 5000);
    </script>
</body>
</html>
