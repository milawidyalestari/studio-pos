<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio POS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0050C8 0%, #003a9b 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            color: white;
            max-width: 400px;
            padding: 40px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: logoBounce 2s ease-in-out infinite;
        }

        @keyframes logoBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .logo-icon {
            font-size: 36px;
            color: #0050C8;
        }

        .app-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .app-subtitle {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .loading-container {
            position: relative;
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin: 0 auto 20px;
            overflow: hidden;
        }

        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            border-radius: 2px;
            width: 0%;
            animation: loadingProgress 2.5s ease-out forwards;
        }

        @keyframes loadingProgress {
            0% { width: 0%; }
            20% { width: 30%; }
            40% { width: 60%; }
            60% { width: 80%; }
            80% { width: 95%; }
            100% { width: 100%; }
        }

        .loading-text {
            font-size: 0.9rem;
            opacity: 0.8;
            animation: textFade 0.5s ease-in-out;
        }

        @keyframes textFade {
            from { opacity: 0; }
            to { opacity: 0.8; }
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .version {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 0.8rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo">
            <div class="logo-icon">📊</div>
        </div>
        
        <h1 class="app-title">Studio POS</h1>
        <p class="app-subtitle">Point of Sale System</p>
        
        <div class="loading-container">
            <div class="loading-bar"></div>
        </div>
        
        <div class="loading-text" id="loadingText">Loading...</div>
        <div class="spinner"></div>
    </div>

    <div class="version">v1.0.0</div>

    <script>
        const loadingTexts = [
            "Loading...",
            "Initializing...",
            "Almost ready..."
        ];

        let textIndex = 0;
        const textElement = document.getElementById('loadingText');

        function updateText() {
            textElement.textContent = loadingTexts[textIndex];
            textIndex = (textIndex + 1) % loadingTexts.length;
        }

        // Update text every 800ms
        setInterval(updateText, 800);
    </script>
</body>
</html>
